{% extends "expedition/base.html" %}

{% block title %}{{ page_title }} — TransConnect{% endblock %}

{% block content %}
<section class="panel">
    <span class="warning-mark" aria-hidden="true">!</span>
    <p class="eyebrow">Confirmation requise</p>
    <h1>{{ page_title }}</h1>
    <p class="intro">{{ page_intro }} <strong>{{ object }}</strong>.</p>
    {% if delete_warning %}<p>{{ delete_warning }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="button-danger" type="submit">Confirmer la suppression</button>
            <a class="button button-secondary" href="{% url list_url_name %}">Annuler</a>
        </div>
    </form>
</section>
{% endblock %}
